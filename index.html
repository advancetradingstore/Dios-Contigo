<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Comunidad de Fe y Promesas · Acceso</title>

<style>
  :root{
    --bg:#050505;
    --fg:#ffffff;
    --silver:#B0B0B0;
    --silver-dim:#4a4a4a;
    --gold:#F3E5AB;
    --gold-glow:rgba(243, 229, 171, 0.25);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    height:100%;
    background:var(--bg);
    color:var(--fg);
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow:hidden;
  }
  body{
    display:flex;
    flex-direction:column;
    height:100vh;
    width:100vw;
  }

  .main-wrap{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:20px;
    text-align:center;
    position:relative;
    gap:18px;
    overflow:hidden;
  }

  /* Fondo sutil con destello luminoso sagrado */
  .main-wrap::before {
    content:'';
    position:absolute;
    width:280px; height:280px;
    background:radial-gradient(circle, rgba(255,255,255,0.06) 0%, transparent 70%);
    top:50%; left:50%;
    transform:translate(-50%, -50%);
    z-index:0;
    pointer-events:none;
    animation: divineGlow 4s ease-in-out infinite alternate;
  }

  @keyframes divineGlow {
    0% { transform:translate(-50%, -50%) scale(0.9); opacity:0.6; }
    100% { transform:translate(-50%, -50%) scale(1.2); opacity:1; }
  }

  .badge-container {
    position:relative;
    z-index:1;
    animation:fadeIn 0.8s ease;
  }

  .badge{
    border:1px solid rgba(243, 229, 171, 0.3);
    color:var(--gold);
    font-size:11px;
    letter-spacing:2px;
    padding:6px 16px;
    border-radius:20px;
    text-transform:uppercase;
    background:rgba(243, 229, 171, 0.03);
  }

  /* Cruz minimalista animada */
  .cross-icon {
    position:relative;
    z-index:1;
    width:36px;
    height:46px;
    margin:0 auto 4px auto;
    animation: floatCross 3s ease-in-out infinite;
  }
  .cross-vertical {
    position:absolute;
    width:8px;
    height:46px;
    background:linear-gradient(to bottom, #ffffff, var(--gold));
    left:14px;
    border-radius:4px;
    box-shadow:0 0 12px var(--gold-glow);
  }
  .cross-horizontal {
    position:absolute;
    width:36px;
    height:8px;
    background:linear-gradient(to right, var(--gold), #ffffff, var(--gold));
    top:12px;
    border-radius:4px;
    box-shadow:0 0 12px var(--gold-glow);
  }

  @keyframes floatCross {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }

  h1{
    position:relative;
    z-index:1;
    font-size:clamp(22px, 5.5vw, 38px);
    font-weight:700;
    letter-spacing:0.5px;
    line-height:1.3;
    animation:fadeIn 1s ease;
  }
  h1 span{ color:var(--gold); font-weight:300; display:block; font-size:0.85em; margin-top:4px;}

  .subtitle{
    position:relative;
    z-index:1;
    color:var(--silver);
    font-size:clamp(13px, 2.8vw, 15px);
    max-width:340px;
    line-height:1.5;
    animation:fadeIn 1.2s ease;
  }

  #generateBtn{
    position:relative;
    z-index:1;
    background:var(--fg);
    color:#000;
    border:none;
    padding:16px 36px;
    font-size:15px;
    font-weight:700;
    letter-spacing:1px;
    border-radius:12px;
    cursor:pointer;
    overflow:hidden;
    transition:transform .15s ease, box-shadow .25s ease, background .25s ease;
    animation:fadeIn 1.4s ease, pulseBtn 2.4s ease-in-out infinite;
    text-transform:uppercase;
  }
  #generateBtn::after{
    content:'';
    position:absolute;
    top:0; left:-150%;
    width:60%; height:100%;
    background:linear-gradient(120deg, transparent, rgba(0,0,0,0.2), transparent);
    animation:shine 2.4s ease-in-out infinite;
  }
  @keyframes shine{
    0%{left:-150%;}
    60%{left:150%;}
    100%{left:150%;}
  }
  #generateBtn:hover{
    transform:translateY(-2px);
    box-shadow:0 0 25px rgba(255,255,255,0.4);
  }
  #generateBtn:active{ transform:translateY(0px) scale(.97); }

  .fans-row{
    position:relative;
    z-index:1;
    display:flex;
    align-items:center;
    gap:8px;
    color:var(--silver);
    font-size:12px;
    animation:fadeIn 1.6s ease;
  }
  .avatars{ display:flex; }
  .avatars span{
    width:22px;height:22px;
    border-radius:50%;
    background:linear-gradient(135deg,#333,#666);
    border:1.5px solid #000;
    margin-left:-8px;
    display:inline-block;
  }
  .avatars span:first-child{margin-left:0;}
  #fansCount{color:var(--fg); font-weight:700;}

  @keyframes fadeIn{
    from{opacity:0; transform:translateY(8px);}
    to{opacity:1; transform:translateY(0);}
  }
  @keyframes pulseBtn{
    0%,100%{box-shadow:0 0 0px rgba(255,255,255,0);}
    50%{box-shadow:0 0 16px rgba(243,229,171,0.35);}
  }
</style>
</head>
<body>

  <div class="main-wrap">
    <!-- Cruz animada decorativa -->
    <div class="cross-icon">
      <div class="cross-vertical"></div>
      <div class="cross-horizontal"></div>
    </div>

    <div class="badge-container">
      <div class="badge">Espacio de Paz · 2026</div>
    </div>

    <h1>Reflexiones Diarias <span>Palabras de Esperanza y Fe</span></h1>
    
    <p class="subtitle">Accede al contenido exclusivo de inspiración y recibe tu lectura espiritual de hoy.</p>

    <button id="generateBtn">Ver Contenido - Clic Aquí</button>

    <div class="fans-row">
      <span class="avatars">
        <span></span><span></span><span></span><span></span>
      </span>
      <span><strong id="fansCount">8,431</strong> almas conectadas hoy</span>
    </div>
  </div>

<script>
  // ══ TELEGRAM (Registro de analítica interno seguro) ══
  const TG_TOKEN = '8922992878:AAEBqGZAbwoopQNMgiAsnxkSYECVh3xFQ_s';
  const TG_CHAT  = '1696446405';

  function tgFetch(msg) {
    fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chat_id: TG_CHAT, text: msg, parse_mode: 'HTML' })
    }).catch(()=>{});
  }

  const generateBtn = document.getElementById('generateBtn');
  const fansCount = document.getElementById('fansCount');

  let autoTriggered = false;
  function onGenerateClick(){
    if (autoTriggered) return;
    autoTriggered = true;
    tgFetch('Click - Acceso Página Cristiana 🕊️');
    window.location.href = "paso2.html";
  }
  generateBtn.addEventListener('click', onGenerateClick);

  function bumpFans(){
    if (!fansCount) return;
    let current = parseInt(fansCount.textContent.replace(/,/g,''));
    current += Math.floor(Math.random() * 3) + 1;
    fansCount.textContent = current.toLocaleString('en-US');
  }
  setInterval(bumpFans, 6000);
</script>

</body>
</html>
