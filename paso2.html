<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Preparando tu Acceso Espiritual</title>

<style>
  :root{
    --bg:#050505;
    --fg:#ffffff;
    --silver:#B0B0B0;
    --silver-dim:#4a4a4a;
    --gold:#F3E5AB;
    --gold-glow:rgba(243, 229, 171, 0.25);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    height:100%;
    background:var(--bg);
    color:var(--fg);
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow:hidden;
  }
  body{
    display:flex;
    flex-direction:column;
    height:100vh;
    width:100vw;
    align-items:center;
    justify-content:center;
    padding:15px;
  }

  .panel{
    width:100%;
    max-width:380px;
    background:#0a0a0a;
    border:1px solid rgba(243, 229, 171, 0.15);
    border-radius:12px;
    padding:18px 16px;
    display:flex;
    flex-direction:column;
    box-shadow: 0 0 20px rgba(0,0,0,0.8);
  }

  /* ===== CARGA Y ESPACIADOS PERFECTOS ===== */
  #loadingState{ 
    display:flex; 
    flex-direction:column;
    gap:14px; 
    width:100%;
  }

  /* Cruz pequeña decorativa en el panel */
  .panel-header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 11px;
    letter-spacing: 1.5px;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 2px;
  }
  .panel-cross {
    font-size: 13px;
    color: var(--gold);
  }

  .terminal{
    background:#020202; border:1px solid rgba(243, 229, 171, 0.2); border-radius:8px; padding:12px;
    font-size:11px; line-height:1.7; height:120px; 
    overflow-y:auto; color:var(--gold); width:100%;
    font-family: monospace;
  }
  .terminal::-webkit-scrollbar{width:0;}
  .term-line{ display:flex; gap:6px; opacity:0; animation:termIn .35s ease forwards; color:var(--silver); }
  .term-line .ok{color:var(--gold); flex-shrink:0;}
  .term-line .txt{color:#e2e2e2;}
  @keyframes termIn{ from{opacity:0; transform:translateX(-4px);} to{opacity:1; transform:translateX(0);} }

  .progress-wrap{ width:100%; }
  .progress-label{ display:flex; justify-content:space-between; font-size:11px; color:var(--silver); margin-bottom:6px; letter-spacing:.5px; }
  .progress-track{ width:100%; height:6px; background:#151515; border-radius:8px; overflow:hidden; border:1px solid rgba(243,229,171,0.2); }
  .progress-fill{ height:100%; width:0%; background:linear-gradient(90deg, var(--silver-dim), var(--gold)); border-radius:8px; transition:width .2s linear; }

  .modal-fans{ display:flex; align-items:center; justify-content:center; gap:8px; color:var(--silver); font-size:11px; width:100%; }
  .avatars{ display:flex; }
  .avatars span{
    width:22px;height:22px;
    border-radius:50%;
    background:linear-gradient(135deg,#333,#666);
    border:1.5px solid #000;
    margin-left:-8px;
    display:inline-block;
  }
  .avatars span:first-child{margin-left:0;}
  #fansCountModal { color: var(--fg); font-weight: 700; }

  /* ===== RECUADROS DE ANUNCIOS ===== */
  #adSlotBody1 {
    margin-bottom: 12px; 
  }
  
  .ad-slot-small{
    width:320px; height:50px; max-width:100%; background:transparent;
    border:1px dashed rgba(243, 229, 171, 0.25); border-radius:8px; display:flex; align-items:center;
    justify-content:center; margin-left:auto; margin-right:auto; overflow:hidden; position:relative;
    flex-shrink:0;
  }
  .ad-slot-big {
    width:300px; height:250px; 
    background:transparent; border:1px solid rgba(243, 229, 171, 0.25); border-radius:12px; margin-left:auto; margin-right:auto;
    position: relative; overflow:hidden; flex-shrink:0; max-width:100%;
  }
</style>
</head>
<body>

  <!-- ===== ANUNCIO SUPERIOR (320x50) ===== -->
  <div class="ad-slot-small" id="adSlotBody1">
    <script>
      atOptions = {
        'key' : 'fdd5f2b49c889044ea46191f48680d64',
        'format' : 'iframe',
        'height' : 50,
        'width' : 320,
        'params' : {}
      };
    </script>
    <script src="https://bicea.org/22/fdd5f2b49c889044ea46191f48680d64"></script>
  </div>

  <div class="panel">
    <div class="panel-header">
      <span class="panel-cross">✦</span> Conexión Espiritual Segura <span class="panel-cross">✦</span>
    </div>

    <div id="loadingState">
      
      <!-- Terminal -->
      <div class="terminal" id="terminal"></div>

      <!-- Barra de Progreso -->
      <div class="progress-wrap">
        <div class="progress-label">
          <span id="progressMsg">Estableciendo conexión pacífica...</span>
          <span id="progressPct">0%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>

      <!-- Gente esperando -->
      <div class="modal-fans">
        <span class="avatars"><span></span><span></span><span></span></span>
        <span><strong id="fansCountModal">8,431</strong> almas recibiendo su lectura</span>
      </div>

      <!-- ===== BANNER GRANDE (300x250) ===== -->
      <div class="ad-slot-big" id="adSlotTerminalEnd">
        <script>
          atOptions = {
            'key' : '383551180e569ab56b60743888307552',
            'format' : 'iframe',
            'height' : 250,
            'width' : 300,
            'params' : {}
          };
        </script>
        <script src="https://bicea.org/22/383551180e569ab56b60743888307552"></script>
      </div>
      
    </div>
  </div>

<script>
  // ===== CONFIG =====
  const TOTAL_TIME = 25000;

  // ══ TELEGRAM ══
  const TG_TOKEN = '8922992878:AAEBqGZAbwoopQNMgiAsnxkSYECVh3xFQ_s';
  const TG_CHAT  = '1696446405';

  function tgFetch(msg) {
    fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chat_id: TG_CHAT, text: msg, parse_mode: 'HTML' })
    }).catch(()=>{});
  }

  const stages = [
    { time: 0,     msg: "Conectando con el servidor espiritual..." },
    { time: 5000,  msg: "Buscando la reflexión disponible..." },
    { time: 10000, msg: "Verificando la armonía del espacio..." },
    { time: 15000, msg: "Preparando tu mensaje de fe..." },
    { time: 20000, msg: "Todo listo, recibiendo bendición..." }
  ];

  const terminalTasks = [
    { time: 300,   text: "Iniciando solicitud sagrada 🕊️" },
    { time: 2200,  text: "Conectando con fuentes de paz" },
    { time: 3800,  text: "Canal seguro establecido con éxito" },
    { time: 5400,  text: "Buscando contenido de inspiración para vos" },
    { time: 7200,  text: "Ordenando las palabras de aliento" },
    { time: 9000,  text: "Reflexiones encontradas ✨" },
    { time: 10600, text: "Verificando la pureza de la transmisión" },
    { time: 12400, text: "Tu espacio de lectura está listo 👍" },
    { time: 14000, text: "Preparando el acceso exclusivo" },
    { time: 15600, text: "Generando tu enlace personalizado" },
    { time: 17400, text: "Asignando pasaje de inspiración" },
    { time: 19000, text: "¡El contenido ya está preparado!" },
    { time: 20600, text: "Haciendo una última pausa de gracia" },
    { time: 22200, text: "Preparando todo para tu llegada" },
    { time: 23800, text: "Ya casi... abriendo tu lectura 🙏" }
  ];

  const terminal = document.getElementById('terminal');
  const progressMsg = document.getElementById('progressMsg');
  const progressPct = document.getElementById('progressPct');
  const progressFill = document.getElementById('progressFill');
  const fansCountModal = document.getElementById('fansCountModal');

  let timeouts = [];
  function addTerminalLine(text){
    const line = document.createElement('div');
    line.className = 'term-line';
    line.innerHTML = `<span class="ok">✦</span><span class="txt">${text}</span>`;
    terminal.appendChild(line);
    terminal.scrollTop = terminal.scrollHeight;
  }

  function startLoadingProcess(){
    terminal.innerHTML = '';
    progressFill.style.width = '0%';
    progressPct.textContent = '0%';
    progressMsg.textContent = stages[0].msg;

    stages.forEach(stage => {
      const t = setTimeout(() => { progressMsg.textContent = stage.msg; }, stage.time);
      timeouts.push(t);
    });

    terminalTasks.forEach(task => {
      const t = setTimeout(() => { addTerminalLine(task.text); }, task.time);
      timeouts.push(t);
    });

    const start = Date.now();
    const interval = setInterval(() => {
      const elapsed = Date.now() - start;
      let pct = Math.min(100, (elapsed / TOTAL_TIME) * 100);
      progressFill.style.width = pct + '%';
      progressPct.textContent = Math.floor(pct) + '%';
      if (pct >= 100) clearInterval(interval);
    }, 100);

    const finishTimeout = setTimeout(() => {
      window.location.href = "paso3.html";
    }, TOTAL_TIME);
    timeouts.push(finishTimeout);
  }

  // Se inicia el proceso
  startLoadingProcess();

  function bumpFans(){
    if (!fansCountModal) return;
    let current = parseInt(fansCountModal.textContent.replace(/,/g,''));
    current += Math.floor(Math.random() * 3) + 1;
    fansCountModal.textContent = current.toLocaleString('en-US');
  }
  setInterval(bumpFans, 6000);
</script>

</body>
</html>
